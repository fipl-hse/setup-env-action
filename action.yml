name: 'Setup environment'
description: 'Setup environment for HSE FIPL courses'
runs:
  using: "composite"
  steps:
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13.11'
    - name: Cache pip
      uses: actions/cache@v6
      id: cache
      with:
        path: |
          ./venv/
          ~/.local/bin/mystem
        key: ${{ env.GITHUB_REPOSITORY }}-${{ env.BRANCH_NAME }}-pip-${{ hashFiles('**/requirements*.txt') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        LOCAL_SCRIPT="${{ github.workspace }}/admin_utils/venv_setup.sh"
        DEFAULT_SCRIPT="${{ github.action_path }}/venv_setup.sh"
        if [ -f "$LOCAL_SCRIPT" ]; then
          bash "$LOCAL_SCRIPT"
        else
          bash "$DEFAULT_SCRIPT"
        fi
